# Streamlit theming — dark "techy" base that the custom CSS in app/app.py builds on.
[theme]
base = "dark"
primaryColor = "#8b5cf6"
backgroundColor = "#07070f"
secondaryBackgroundColor = "#0d0d1a"
textColor = "#e2e8f0"
font = "Inter"
headingFont = "Inter"
codeFont = "JetBrains Mono"

[server]
# Don't phone home with usage stats.
gatherUsageStats = false

[browser]
# Don't try to open a tab when launched from a server / CI context.
gatherUsageStats = false

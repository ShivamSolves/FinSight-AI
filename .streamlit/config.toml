# Streamlit theming — light wondercraft-style base that the custom CSS in
# app/app.py builds on: pale periwinkle canvas, white cards, navy ink, mint primary.
[theme]
base = "light"
primaryColor = "#00cf9e"
backgroundColor = "#f5f6fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#233048"
font = "Figtree"
headingFont = "Bricolage Grotesque"
codeFont = "Figtree"

[server]
# Don't phone home with usage stats.
gatherUsageStats = false

[browser]
# Don't try to open a tab when launched from a server / CI context.
gatherUsageStats = false
